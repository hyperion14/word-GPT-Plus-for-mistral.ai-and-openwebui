server {
    listen 80;
    server_name localhost;

    # Serve the Word GPT Plus application
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy to jachat Open-WebUI (Port 3010)
    location /jachat-api/ {
        # Remove /jachat-api/ prefix and forward to jachat-open-webui
        rewrite ^/jachat-api/(.*) /$1 break;

        proxy_pass http://jachat-open-webui:8080;
        proxy_http_version 1.1;

        # Headers for proper proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Proxy to bhk Open-WebUI (Port 3000 / chat.bhk-x.de)
    location /bhk-api/ {
        # Remove /bhk-api/ prefix and forward to bhk-open-webui
        rewrite ^/bhk-api/(.*) /$1 break;

        proxy_pass http://bhk-open-webui:8080;
        proxy_http_version 1.1;

        # Headers for proper proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Legacy endpoint (backward compatibility) - points to jachat
    location /openwebui-api/ {
        # Remove /openwebui-api/ prefix and forward to jachat (default)
        rewrite ^/openwebui-api/(.*) /$1 break;

        proxy_pass http://jachat-open-webui:8080;
        proxy_http_version 1.1;

        # Headers for proper proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
