server {
    listen 80;
    server_name localhost;

    # Docker DNS resolver for dynamic container name resolution
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # Serve the Word GPT Plus application
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy to jachat Open-WebUI (Port 3010)
    location /jachat-api/ {
        set $jachat_upstream http://jachat-open-webui:8080;

        rewrite ^/jachat-api/(.*) /$1 break;

        proxy_pass $jachat_upstream;
        proxy_http_version 1.1;

        # Headers for proper proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts (300s for long LLM responses)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Proxy to bhk Open-WebUI (Port 3000 / chat.bhk-x.de)
    location /bhk-api/ {
        set $bhk_upstream http://bhk-open-webui:8080;

        rewrite ^/bhk-api/(.*) /$1 break;

        proxy_pass $bhk_upstream;
        proxy_http_version 1.1;

        # Headers for proper proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts (300s for long LLM responses)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Legacy endpoint (backward compatibility) - points to jachat
    location /openwebui-api/ {
        set $legacy_upstream http://jachat-open-webui:8080;

        rewrite ^/openwebui-api/(.*) /$1 break;

        proxy_pass $legacy_upstream;
        proxy_http_version 1.1;

        # Headers for proper proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts (300s for long LLM responses)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
